# azure-pipelines.yml — API Commons OpenLint pipeline governance gate. Findings publish as JUnit.
trigger: none
pr:
  - main
pool:
  vmImage: ubuntu-latest
steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
  - script: >
      npx -y openlint lint "apis/**/openapi.yaml"
      --ruleset .openlint.yaml --fail-severity error
      --format junit --output openlint-junit.xml
    displayName: API Commons OpenLint Governance
  - task: PublishTestResults@2
    condition: always()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: openlint-junit.xml
      testRunTitle: API Commons OpenLint Governance
