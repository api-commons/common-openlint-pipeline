# buildspec.yml — API Commons OpenLint pipeline governance gate for AWS CodeBuild.
version: 0.2
phases:
  install:
    runtime-versions:
      nodejs: 22
  build:
    commands:
      - npx -y openlint lint "apis/**/openapi.yaml"
          --ruleset .openlint.yaml --fail-severity error
          --format junit --output openlint-junit.xml
reports:
  openlint-governance:
    files:
      - openlint-junit.xml
    file-format: JUNITXML
