# bitbucket-pipelines.yml — API Commons OpenLint pipeline governance gate on pull requests.
pipelines:
  pull-requests:
    '**':
      - step:
          name: API Commons OpenLint Governance
          image: node:22
          script:
            - npx -y openlint lint "apis/**/openapi.yaml"
                --ruleset .openlint.yaml
                --fail-severity error
                --format pretty
