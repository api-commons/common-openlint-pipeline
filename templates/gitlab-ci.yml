# .gitlab-ci.yml — API Commons OpenLint pipeline governance gate. Findings publish as JUnit.
openlint-governance:
  image: node:22-alpine
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npx -y openlint lint "apis/**/openapi.yaml"
        --ruleset .openlint.yaml
        --fail-severity error
        --format junit --output openlint-junit.xml
  artifacts:
    when: always
    reports:
      junit: openlint-junit.xml
